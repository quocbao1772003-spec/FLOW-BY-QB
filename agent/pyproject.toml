[project]
name = "flowboard-agent"
version = "1.2.20"
description = "Flowboard local agent: FastAPI + SQLite + extension bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Local, faithful upscaling (Lanczos + unsharp) — see routes/upscale.py.
    "Pillow>=10.0",
    # MCP server (flowboard_mcp) — lets Claude / ChatGPT drive Flowboard.
    "mcp>=2.3,<3",
]

[project.scripts]
flowboard-mcp = "flowboard_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowboard", "flowboard_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
